# Publishes a GitHub Release whenever a version tag (v1.2.3, v1.2.3-beta.1) is pushed.
# Make the tag with:  python3 scripts/release.py 1.2.3 --push   (bumps every version file, commits, tags, pushes)
# Re-publish an existing tag: Actions > Release > Run workflow > tag.
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)publish, e.g. v0.2.0
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0          # full history + tags for the commit list since the previous release

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Lua 5.1 (plugin syntax check)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.1

      - name: Check versions, code and styles
        run: python3 scripts/release.py --check "$TAG"

      - name: Package the Lightroom plugin
        run: |
          cd lightroom_plugin
          zip -qr "../LightroomAgent.lrplugin-${TAG}.zip" LightroomAgent.lrplugin -x '*/DEV_ENABLE_EVAL' '*.DS_Store'
          cd .. && unzip -l "LightroomAgent.lrplugin-${TAG}.zip"

      - name: Release notes
        run: python3 scripts/release.py --notes "$TAG" | tee notes.md

      - name: Publish the release
        run: |
          pre=""
          case "$TAG" in *-*) pre="--prerelease" ;; esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file notes.md
            gh release upload "$TAG" "LightroomAgent.lrplugin-${TAG}.zip" --clobber
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md $pre \
              "LightroomAgent.lrplugin-${TAG}.zip"
          fi
          echo "published: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
